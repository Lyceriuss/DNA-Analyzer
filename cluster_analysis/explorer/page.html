<meta name="dash-one-writer">
<style>
  .gx { display: grid; gap: var(--cds-gap-lg); font-family: var(--font-anthropic-sans); }
  .gx-head { display: grid; gap: var(--cds-gap-xs); grid-template-columns: minmax(0, 1fr) auto; }
  .gx-head > :not(.gx-tools) { grid-column: 1; }
  /* The right-hand tools: the profile switcher beside the language switch, adding a person beneath */
  .gx-tools { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .gx-tools-row { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 12px; }
  @media (max-width: 40rem) { .gx-head { grid-template-columns: minmax(0, 1fr); } .gx-tools { grid-column: 1; grid-row: auto; align-items: flex-start; } .gx-tools-row { justify-content: flex-start; } }
  .gx-profile { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--color-fg-muted); }
  .gx-profile-set { display: flex; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
  .gx-profile button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 10px; border: 0; background: transparent; color: var(--color-fg-muted); cursor: pointer; }
  .gx-profile button[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); }
  .gx-profile button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -2px; }
  .gx-lang { display: flex; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
  .gx-lang button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 10px; border: 0; background: transparent; color: var(--color-fg-muted); cursor: pointer; }
  .gx-lang button[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); }
  .gx-lang button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -2px; }
  .gx-i18n { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
  .gx-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); margin: 0; text-wrap: balance; }
  .gx-lede { margin: 0; color: var(--color-fg-muted); max-width: 70ch; }
  .gx .gx-lede b, .gx .gx-note b { color: var(--color-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gx-tabs { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); border-bottom: 1px solid var(--color-border-line); }
  .gx-tab { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--color-fg-muted);
            padding: var(--cds-pad-sm) var(--cds-pad-md); cursor: pointer; margin-bottom: -1px; }
  .gx-tab[aria-selected="true"] { color: var(--color-fg); border-bottom-color: var(--color-fg); }
  @media (pointer: coarse) { .gx-tab { min-height: 44px; } }   /* touch: a finger-sized target */
  .gx-tab:focus-visible, .gx-chip:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  .gx-page { display: grid; gap: var(--cds-gap-md); }
  .gx-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: var(--cds-gap-md); }
  .gx-kpi { display: grid; gap: var(--cds-gap-xs); }
  .gx-kpi-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .gx-kpi-value { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); font-variant-numeric: tabular-nums; }
  .gx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: var(--cds-gap-md); }
  .gx-wide { grid-column: 1 / -1; }
  .gx-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius);
             padding: var(--cds-pad-lg); display: grid; gap: var(--cds-gap-sm); align-content: start; min-width: 0; }
  .gx-card h2, .gx-card h3 { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; }
  .gx-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 0; max-width: 75ch; }
  /* A tab's opening paragraph: readable size, a comfortable line length, no lone last word */
  .gx-intro { margin: 0; max-width: 78ch; color: var(--color-fg-muted); line-height: 1.55; text-wrap: pretty; }
  .gx-lede, .gx-note, .gx-intro { text-wrap: pretty; }
  .gx-sample { border-left: 3px solid var(--color-warn); padding-left: var(--cds-pad-sm); }
  .gx-chart { position: relative; min-width: 0; }
  .gx-net { min-height: 460px; }
  .gx-heat { min-height: 420px; overflow-x: auto; }
  .gx-bars { min-height: 380px; }
  .gx-chart svg { display: block; }
  .gx-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border);
            border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm);
            font-size: var(--cds-font-size-caption); max-width: 18rem; z-index: 2; }
  .gx-tip-head { color: var(--cds-text-secondary); }
  .gx-detail { display: grid; gap: var(--cds-gap-sm); min-height: 300px; align-content: start; }
  .gx-detail h3 { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: var(--cds-font-size-title); }
  .gx-label { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: .04em; }
  .gx-chips { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }
  .gx-chip { font: inherit; font-size: var(--cds-font-size-caption); border: 1px solid var(--color-border-line); background: var(--color-bg);
             color: var(--color-fg); border-radius: 999px; padding: 2px var(--cds-pad-sm); }
  button.gx-chip { cursor: pointer; }
  button.gx-chip:hover { border-color: var(--color-fg-muted); }
  .gx-table-box { max-height: 26rem; overflow: auto; }
  .gx-table { width: 100%; border-collapse: collapse; font-size: var(--cds-font-size-caption); font-variant-numeric: tabular-nums; }
  .gx-table th { position: sticky; top: 0; background: var(--color-panel); text-align: left; font-weight: var(--cds-font-weight-medium);
                 color: var(--color-fg-muted); padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); }
  .gx-table td { padding: var(--cds-pad-xs) var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); vertical-align: top; }
  .gx-up { color: var(--color-bad); }
  .gx-down { color: var(--color-ok); }
  .gx-muted { color: var(--color-fg-muted); }
  .gx [data-dash-source-state=empty] { color: transparent; }
  .gx [data-dash-source-state=refreshing] { opacity: .5; transition: opacity var(--cds-dur-slow); }
  @media (max-width: 40rem) { .gx-hide-narrow { display: none; } }
  /* Call scale: blue = more active (GoF), green = typical function, red = less active (LoF). The blue leans towards the
     text colour, so it lightens in dark mode and deepens in light mode like the theme tokens do. */
  .gx { --gof: color-mix(in srgb, #3b82f6 82%, var(--color-fg)); --typical: var(--color-ok); }
  /* @include lc.css */
  /* Clusters: a theme or Nutrition */
  .gx:has(.th-pick-nut[aria-pressed=true]) #clusters > :not(.th-picker),
  .gx:not(:has(.th-pick-nut[aria-pressed=true])) #nutrition { display: none !important; }
  .bm-pair { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; }
  .bm-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; min-width: 100px; }
  .bm-stack .bm-kind { color: var(--color-fg); } .bm-buffer .bm-kind { color: var(--color-fg-muted); }
  .bm-score { margin-left: auto; color: var(--color-fg-muted); font-variant-numeric: tabular-nums; }

<script>
  // @settings
  // @sources
  // @prevention
  // @mind
  // @lab
  // Calculations from the attached datasets

  // Shared helpers
  // Profiles: each personal dataset holds every person's rows, tagged with `person`; gx.rows hands a draw only the
  // selected person's (memoised per array and person, so caches keyed on the array stay valid).
  const PERSON_ROWS = new WeakMap();
  const forPerson = (arr, who) => {
    if (!Array.isArray(arr) || !arr.length || !('person' in arr[0])) return arr;
    let m = PERSON_ROWS.get(arr);
    if (!m) { m = new Map(); PERSON_ROWS.set(arr, m); }
    if (!m.has(who)) m.set(who, arr.filter((r) => !r.person || r.person === who));
    return m.get(who);
  };
  let savedWho = null;
  try { savedWho = localStorage.getItem('gx-person'); } catch (e) { /* storage blocked: the first profile */ }
  window.gx = {
    who() {
      const d = dash.data('profiles');
      const ids = d.status === 'ok' ? d.data.map((p) => p.id) : [];
      const want = dash.params().person || savedWho;
      return ids.includes(want) ? want : ids[0] || want || 'XY';
    },
    rows(...ids) {
      const all = ids.map((id) => dash.data(id));
      if (!all.every((d) => d.status === 'ok')) return null;
      const who = gx.who();
      return all.map((d) => forPerson(d.data, who));
    },
    failed(...ids) { return ids.some((id) => dash.data(id).status === 'error'); },
    color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || null; },
    show(tab) {
      // Nutrition is a choice in the Clusters picker; the old Profile opens Biomarkers
      if (tab === 'nutrition') { dash.setParams({ theme: 'nutrition' }); tab = 'clusters'; }
      if (tab === 'profile') tab = 'biomarkers';
      document.querySelectorAll('.gx-page').forEach((p) => { p.hidden = p.dataset.page !== tab; });
      document.querySelectorAll('.gx-tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
      dash.setLink(tab);
    },
    tip(box) {
      let t = box.querySelector('.gx-tip');
      if (!t) { t = document.createElement('div'); t.className = 'gx-tip'; t.hidden = true; box.appendChild(t); }
      return {
        show(event, head, lines) {
          t.replaceChildren();
          const h = document.createElement('div'); h.className = 'gx-tip-head'; h.textContent = head; t.appendChild(h);
          for (const l of lines) { const d = document.createElement('div'); d.textContent = l; t.appendChild(d); }
          t.hidden = false;
          const b = box.getBoundingClientRect();
          let x = event.clientX - b.left + 12, y = event.clientY - b.top + 12;
          x = Math.min(x, box.clientWidth - t.offsetWidth - 4);
          t.style.left = Math.max(0, x) + 'px'; t.style.top = y + 'px';
        },
        hide() { t.hidden = true; },
      };
    },
    failLine(el) {
      el.replaceChildren();
      const p = document.createElement('p'); p.className = 'gx-note'; p.textContent = 'Failed to load'; el.appendChild(p);
    },
    // A profile whose analysis hasn't produced this part yet: say so instead of drawing nothing (or throwing)
    emptyLine(el) {
      el.replaceChildren();
      const p = document.createElement('p'); p.className = 'gx-note'; p.textContent = 'No results for this profile yet: this part of its analysis has not been run.'; el.appendChild(p);
    },
  };

  document.querySelectorAll('.gx-tab').forEach((b) => b.addEventListener('click', () => gx.show(b.dataset.tab)));

  // Static texts marked data-who name the selected person: each text node keeps its original (English, "XY") as a
  // template, and is rewritten only when the person changes, so the translation layer then translates it again
  const WHO_TPL = new WeakMap();
  let shownWho = null;
  const applyWho = (who) => {
    if (who === shownWho) return;
    shownWho = who;
    document.querySelectorAll('[data-who]').forEach((el) => {
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) {
        if (!WHO_TPL.has(n)) WHO_TPL.set(n, n.nodeValue);
        const t = WHO_TPL.get(n);
        if (/\bXY\b/.test(t)) n.nodeValue = t.replace(/\bXY\b/g, who);
      }
    });
  };
  document.querySelectorAll('[data-who]').forEach((el) => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) WHO_TPL.set(n, n.nodeValue);
  });
  dash.draw('gx-profile', (el) => {
    const d = dash.data('profiles');
    if (d.status !== 'ok') return;
    const who = gx.who();
    el.replaceChildren();
    const lab = document.createElement('span'); lab.textContent = 'Profile'; el.appendChild(lab);
    const set = document.createElement('div'); set.className = 'gx-profile-set'; el.appendChild(set);
    for (const p of d.data) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = p.id;
      b.title = p.sex === 'female' ? 'Female' : p.sex === 'male' ? 'Male' : '';
      b.setAttribute('aria-pressed', String(p.id === who));
      b.addEventListener('click', () => {
        try { localStorage.setItem('gx-person', p.id); } catch (e) { /* storage blocked: kept for this visit only */ }
        savedWho = p.id;
        // A gene or theme picked for one person may not exist for the other
        dash.setParams({ person: p.id, th_gene: null, th_organ: null, th_facet: null });
      });
      set.appendChild(b);
    }
    // After the draw: the runtime counts a draw's writes outside its own element as stray
    setTimeout(() => applyWho(who), 0);
  });
  const linked = location.hash.slice(1);
  if (['home', 'clusters', 'medicines', 'nutrition', 'lifecycle', 'biomarkers', 'profile', 'ask', 'sources'].includes(linked)) gx.show(linked);


  // Simple number drawings
  const fmt = d3.format(',');

</script>
